version: 2

updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      go-minor:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      webui-minor:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /client
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      flutter-minor:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      actions:
        patterns: ["*"]
