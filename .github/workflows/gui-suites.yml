name: GUI suites (desktop)

# Runs the Flutter GUI integration suites (client/integration_test) headless in
# containers on a hosted runner, sharded across a matrix
# (client/tool/run_gui_suites.sh, docs/ARCHITECTURE.md "Headless GUI suites in
# containers").
#
# This workflow validates the DESKTOP build only. Android is not validated here
# and cannot be: the Android suites need a headless emulator with /dev/kvm, the
# Go backend and the media fixture on the same machine, which is the lab in
# AGENTS.md "Android validation" — it runs on a developer machine, and a physical
# device is the final gate for what the lab cannot see (hardware decode, jank).
# A green run here says nothing about Android; a red one says nothing either.
#
# A failing shard now fails the workflow. It did not before (`continue-on-error`)
# while the suites were proving themselves in containers; they have, and a run
# nobody waits on has no reason to hide its own red.
#
# Manual or nightly, never on push/PR: ~15 min per shard would burn Actions
# minutes on every commit. Two shards a night is about an hour against a private
# repository's free tier; switch the schedule to weekly (`0 6 * * 1`) or back to
# four shards in the matrix line if that budget changes.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC

permissions:
  contents: read

concurrency:
  group: gui-suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui:
    name: Shard ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the suites
        run: client/tool/run_gui_suites.sh -j 2 --shard ${{ matrix.shard }}/2 -o "$RUNNER_TEMP/gui-runs"

      - name: Summary
        if: always()
        run: |
          {
            echo "### GUI suites (desktop), shard ${{ matrix.shard }}/2"
            echo '```'
            cat "$RUNNER_TEMP"/gui-runs/*/summary.tsv 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-suites-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/gui-runs
          retention-days: 7
