name: Client release

# A `client-vX.Y.Z` tag builds the Linux x86_64 client package and attaches it,
# with its SHA-256 checksums file, to a GitHub Release. The client's headless
# updater reads exactly these assets (client/lib/update/release_source.dart):
#   playheadtv-client-X.Y.Z-linux-x64.tar.gz
#   playheadtv-client-X.Y.Z-checksums.txt
# Backend releases use `vX.Y.Z` tags and their own workflow.
on:
  push:
    tags: ['client-v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  package:
    name: Build, package, release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-14-dev libc++-dev libc++abi-dev curl unzip xz-utils

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Unit tests (gate)
        working-directory: client
        run: |
          flutter pub get
          flutter analyze
          flutter test
          tool/test_launcher.sh

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          FLUTTER: flutter
          DART: dart
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          client/tool/package_linux.sh "$TAG" client/dist

      - name: Verify the package
        working-directory: client/dist
        run: |
          sha256sum -c ./*-checksums.txt
          tar -tzf ./*.tar.gz | grep -q '/bundle/client$'
          tar -tzf ./*.tar.gz | grep -q '/bundle/playheadtv-updater$'
          tar -tzf ./*.tar.gz | grep -q '/install.sh$'

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#client-v}"
          MIN="$(grep -oP 'minSupportedApiVersion = \K[0-9]+' client/lib/update/compat.dart)"
          MAX="$(grep -oP 'maxSupportedApiVersion = \K[0-9]+' client/lib/update/compat.dart)"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Client $VERSION" --generate-notes \
            --notes "Linux x86_64 client. Works with backends whose API version (GET /version) is between $MIN and $MAX. Install: extract the archive and run install.sh; an installed client updates itself from these releases. Verify the download with the checksums file (sha256sum -c)." \
            client/dist/*.tar.gz client/dist/*-checksums.txt
